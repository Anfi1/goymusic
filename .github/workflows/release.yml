name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Version determination ---
      # Источник правды -- реально опубликованные GitHub Releases, а не git-теги:
      # теги пушатся на этапе "Ensure git tag exists and push" ДО того, как релиз
      # реально создан, поэтому rerun упавшей джобы видел уже запушенный тег
      # предыдущей попытки и вычислял версию неправильно (см. инцидент с v6.0.5).
      - name: Determine version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          LATEST_RELEASE=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate |
            jq -sr '[.[][] | select(.draft==false and .prerelease==false) | .tag_name | ltrimstr("v")]
                  | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))
                  | sort_by(split(".") | map(tonumber))
                  | last // "0.0.0"')
          LATEST_RELEASE=${LATEST_RELEASE%$'\r'}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_RELEASE"
          AUTO_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"

          # Явный бамп в package.json имеет приоритет, если он выше авто-версии:
          # так выпускается minor/major-релиз без правки самого workflow.
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_VERSION=${PKG_VERSION%$'\r'}
          NEW_VERSION=$(node -e "const a='$AUTO_VERSION'.split('.').map(Number), b='$PKG_VERSION'.split('.').map(Number); const ok = b.length===3 && b.every(Number.isInteger); const higher = ok && (b[0]-a[0] || b[1]-a[1] || b[2]-a[2]) > 0; console.log(higher ? '$PKG_VERSION' : '$AUTO_VERSION')")
          NEW_VERSION=${NEW_VERSION%$'\r'}

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "previous=$LATEST_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Latest release: $LATEST_RELEASE, package.json: $PKG_VERSION -> building $NEW_VERSION"

          node -e "const p=require('./package.json');p.version='$NEW_VERSION';require('fs').writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"

      # --- Python embedded environment ---
      - name: Setup Python 3.13 embedded
        shell: pwsh
        run: |
          $pyVer = "3.13.2"
          $url = "https://www.python.org/ftp/python/$pyVer/python-$pyVer-embed-amd64.zip"

          New-Item -ItemType Directory -Force -Path python\bin
          Invoke-WebRequest -Uri $url -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath python\bin -Force

          # Enable pip in embedded Python
          $pthFile = "python\bin\python313._pth"
          $content = Get-Content $pthFile
          $content | Set-Content $pthFile
          Add-Content $pthFile "Lib\site-packages"
          Add-Content $pthFile ".."
          Add-Content $pthFile "import site"

          # Install pip
          Invoke-WebRequest -Uri https://bootstrap.pypa.io/get-pip.py -OutFile get-pip.py
          python\bin\python.exe get-pip.py --no-warn-script-location

          # Install requirements
          # yandex-music ships sdist-only on PyPI (no wheel, ever) -- pip's isolated build
          # env can't build it here (BackendUnavailable: Cannot import 'setuptools.build_meta'),
          # so pre-seed setuptools/wheel into the real site-packages and skip build isolation.
          python\bin\python.exe -m pip install setuptools wheel --no-warn-script-location
          $env:PYTHONPATH = "$PWD\python\fork"
          python\bin\python.exe -m pip install -r python\requirements.txt --no-warn-script-location --no-build-isolation

      # --- Node.js build ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package stable installer without publishing
        run: npx electron-builder --publish never

      - name: Verify installed Windows lifecycle, backend and update manifest before publication
        timeout-minutes: 10
        shell: pwsh
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          $file = "GoyMusic-Setup-$env:EXPECTED.exe"
          $setup = Get-Item "release/$file"
          if (!(Test-Path "release/$file.blockmap")) { throw "Missing blockmap" }
          $manifest = Get-Content release/latest.yml -Raw
          $sha = [Convert]::ToBase64String([Convert]::FromHexString((Get-FileHash $setup -Algorithm SHA512).Hash))
          if (!$manifest.Contains($sha) -or !$manifest.Contains($file)) { throw "Installer does not match latest.yml" }
          $dir = Join-Path $env:RUNNER_TEMP "GoyMusic-candidate"
          $p = Start-Process $setup.FullName -ArgumentList "/S", "/D=$dir" -Wait -PassThru
          if ($p.ExitCode) { throw "Candidate install failed" }
          $py = Join-Path $dir "resources/python"
          python .github/workflows/check-backend.py "$py/bin/python.exe" "$py/api.py"
          if ($LASTEXITCODE) { throw "Packaged backend protocol failed" }
          & "$py/bin/python.exe" "$py/test_liked_songs.py"
          if ($LASTEXITCODE) { throw "Packaged library regression" }
          & "$py/bin/python.exe" "$py/test_backend_contract.py"
          if ($LASTEXITCODE) { throw "Cancellation or concurrent request regression" }
          & "$py/bin/python.exe" .github/workflows/check-mobile-host.py
          if ($LASTEXITCODE) { throw "Android host callback contract failed" }
          $info = (Get-Item "$dir/GoyMusic.exe").VersionInfo
          if ("$($info.ProductMajorPart).$($info.ProductMinorPart).$($info.ProductBuildPart)" -ne $env:EXPECTED) { throw "Unexpected candidate version" }
          & ./.github/workflows/check-windows-lifecycle.ps1 -InstallDir $dir
          $uninstaller = Get-ChildItem $dir -Filter "Uninstall*.exe" | Select-Object -First 1
          $p = Start-Process $uninstaller.FullName -ArgumentList "/S", "_?=$dir" -Wait -PassThru
          if ($p.ExitCode) { throw "Candidate uninstall failed" }

      - name: Verify in-app upgrade and relaunch before publication
        if: steps.version.outputs.previous != '0.0.0'
        timeout-minutes: 12
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          $installer = "GoyMusic-Setup-$env:PREVIOUS.exe"
          gh release download "v$env:PREVIOUS" --repo $env:GITHUB_REPOSITORY --pattern $installer --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE) { throw "Cannot download previous installer" }
          Remove-Item Env:GH_TOKEN
          # Playwright управляет окном установленного Electron; браузер скачивать не нужно.
          npm install --prefix "$env:RUNNER_TEMP/update-driver" --ignore-scripts --no-audit --no-fund playwright-core@1.55.1
          if ($LASTEXITCODE) { throw "Cannot install update driver" }
          & ./.github/workflows/check-windows-upgrade.ps1 -LocalFeed

      # --- Push version bump & tag ---
      - name: Ensure git tag exists and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push
          git tag -f "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}" --force

      - name: Publish verified stable installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          installer="release/GoyMusic-Setup-${VERSION}.exe"
          gh release create "v$VERSION" "$installer" "$installer.blockmap" release/latest.yml \
            --verify-tag --title "$VERSION" --generate-notes --latest

      - name: Verify upgrade through the public GitHub update feed
        if: steps.version.outputs.previous != '0.0.0'
        timeout-minutes: 12
        shell: pwsh
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
          EXPECTED: ${{ steps.version.outputs.version }}
        run: ./.github/workflows/check-windows-upgrade.ps1

