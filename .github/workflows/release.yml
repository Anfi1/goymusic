name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Version determination ---
      # Источник правды -- реально опубликованные GitHub Releases, а не git-теги:
      # теги пушатся на этапе "Ensure git tag exists and push" ДО того, как релиз
      # реально создан, поэтому rerun упавшей джобы видел уже запушенный тег
      # предыдущей попытки и вычислял версию неправильно (см. инцидент с v6.0.5).
      - name: Determine version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_RELEASE=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '[.[] | select(.draft==false and .prerelease==false) | .tag_name | ltrimstr("v")]
                  | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))
                  | sort_by(split(".") | map(tonumber))
                  | last // "0.0.0"')

          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_RELEASE"
          AUTO_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"

          # Явный бамп в package.json имеет приоритет, если он выше авто-версии:
          # так выпускается minor/major-релиз без правки самого workflow.
          PKG_VERSION=$(node -p "require('./package.json').version")
          NEW_VERSION=$(node -e "const a='$AUTO_VERSION'.split('.').map(Number), b='$PKG_VERSION'.split('.').map(Number); const ok = b.length===3 && b.every(Number.isInteger); const higher = ok && (b[0]-a[0] || b[1]-a[1] || b[2]-a[2]) > 0; console.log(higher ? '$PKG_VERSION' : '$AUTO_VERSION')")

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Latest release: $LATEST_RELEASE, package.json: $PKG_VERSION -> building $NEW_VERSION"

          node -e "const p=require('./package.json');p.version='$NEW_VERSION';require('fs').writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"

      # --- Python embedded environment ---
      - name: Setup Python 3.13 embedded
        shell: pwsh
        run: |
          $pyVer = "3.13.2"
          $url = "https://www.python.org/ftp/python/$pyVer/python-$pyVer-embed-amd64.zip"

          New-Item -ItemType Directory -Force -Path python\bin
          Invoke-WebRequest -Uri $url -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath python\bin -Force

          # Enable pip in embedded Python
          $pthFile = "python\bin\python313._pth"
          $content = Get-Content $pthFile
          $content | Set-Content $pthFile
          Add-Content $pthFile "Lib\site-packages"
          Add-Content $pthFile "import site"

          # Install pip
          Invoke-WebRequest -Uri https://bootstrap.pypa.io/get-pip.py -OutFile get-pip.py
          python\bin\python.exe get-pip.py --no-warn-script-location

          # Install requirements
          # yandex-music ships sdist-only on PyPI (no wheel, ever) -- pip's isolated build
          # env can't build it here (BackendUnavailable: Cannot import 'setuptools.build_meta'),
          # so pre-seed setuptools/wheel into the real site-packages and skip build isolation.
          python\bin\python.exe -m pip install setuptools wheel --no-warn-script-location
          $env:PYTHONPATH = "$PWD\python\fork"
          python\bin\python.exe -m pip install -r python\requirements.txt --no-warn-script-location --no-build-isolation

      # --- Node.js build ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      # --- Push version bump & tag ---
      - name: Ensure git tag exists and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push
          git tag -f "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}" --force

      # --- Create the GitHub release up front ---
      # electron-builder uploads several assets (exe, blockmap, latest.yml) concurrently;
      # if no release exists yet each upload races to create one, which has produced
      # duplicate release objects for the same tag in the past. Creating the release as
      # a single atomic call first means electron-builder just finds and uploads to it.
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists, reusing it."
          else
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "${{ steps.version.outputs.version }}" --generate-notes --latest
          fi

      # --- Package & Release ---
      - name: Package and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

