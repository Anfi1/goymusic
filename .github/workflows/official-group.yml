name: Compare official Task Manager groups
on:
  push:
    branches: [qa/official-group-716]
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-11-arm
    timeout-minutes: 18
    outputs:
      counts: ${{ steps.inspect.outputs.counts }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: inspect
        run: |
          try { & ./.github/workflows/official-group.ps1 } catch { Write-Output "::error::$($_.Exception.Message)"; throw }
      - uses: actions/upload-artifact@v4
        with:
          name: GoyMusic-restore-7.1.15
          path: restore-kit/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-group-observations
          path: observations/
          if-no-files-found: warn
  result:
    needs: compare
    runs-on: ubuntu-latest
    name: '${{ needs.compare.outputs.counts }}'
    steps:
      - run: echo "$RESULT" >> "$GITHUB_STEP_SUMMARY"
        env:
          RESULT: ${{ needs.compare.outputs.counts }}
